{% extends "base.html" %}
{% block contenido %}
<div class="ca-card">
  <div class="ca-card-header"><h5 class="ca-card-title">{{ _('Editar conciliación de Caja Chica') if edit else _('Nueva conciliación de Caja Chica') }}</h5></div>
  <form method="post" action="{{ url_for('bancos.caja_chica_conciliacion_editar', r_id=registro.id) if edit else '' }}" class="row g-3 p-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if edit %}<div class="col-md-4"><label class="form-label">{{ _('Compañía') }}</label><input class="form-control" value="{{ registro.company }}" readonly></div><div class="col-md-4"><label class="form-label">{{ _('Caja Chica') }}</label><input class="form-control" value="{{ registro.petty_cash_id }}" readonly></div>{% else %}<div class="col-md-4"><label class="form-label">{{ _('Compañía') }}</label><input class="form-control" name="company" required></div><div class="col-md-4"><label class="form-label">{{ _('Caja Chica') }}</label><select class="form-select" name="petty_cash_id" required><option value="">—</option>{% for fund in fondos %}<option value="{{ fund.id }}">{{ fund.company }} - {{ fund.name }}</option>{% endfor %}</select></div>{% endif %}
    <div class="col-md-4"><label class="form-label">{{ _('Fecha') }}</label><input class="form-control" type="date" name="reconciliation_date" value="{{ today or '' }}" required></div>
    <div class="col-md-4"><label class="form-label">{{ _('Efectivo contado') }}</label><input class="form-control" type="number" min="0" step="0.0001" name="counted_cash" value="{{ registro.counted_cash if edit else '' }}" required></div>
    <div class="col-12"><label class="form-label">{{ _('Explicación') }}</label><textarea class="form-control" name="explanation" rows="3">{{ registro.explanation if edit else '' }}</textarea></div>
    <div class="col-12"><button class="btn btn-primary" type="submit">{{ _('Actualizar borrador') if edit else _('Guardar borrador') }}</button> <a class="btn btn-outline-secondary" href="{{ url_for('bancos.caja_chica_conciliacion_lista') }}">{{ _('Cancelar') }}</a></div>
  </form>
</div>
{% endblock %}
