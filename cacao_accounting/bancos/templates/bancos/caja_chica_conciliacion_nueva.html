{% extends "base.html" %}
{% block contenido %}
<div class="ca-card">
  <div class="ca-card-header"><h5 class="ca-card-title">{{ _('Nueva conciliación de Caja Chica') }}</h5></div>
  <form method="post" class="row g-3 p-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-4"><label class="form-label">{{ _('Compañía') }}</label><input class="form-control" name="company" required></div>
    <div class="col-md-4"><label class="form-label">{{ _('Caja Chica') }}</label><select class="form-select" name="petty_cash_id" required><option value="">—</option>{% for fund in fondos %}<option value="{{ fund.id }}">{{ fund.company }} - {{ fund.name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">{{ _('Fecha') }}</label><input class="form-control" type="date" name="reconciliation_date" value="{{ today or '' }}" required></div>
    <div class="col-md-4"><label class="form-label">{{ _('Efectivo contado') }}</label><input class="form-control" type="number" min="0" step="0.0001" name="counted_cash" required></div>
    <div class="col-12"><label class="form-label">{{ _('Explicación') }}</label><textarea class="form-control" name="explanation" rows="3"></textarea></div>
    <div class="col-12"><button class="btn btn-primary" type="submit">{{ _('Guardar borrador') }}</button> <a class="btn btn-outline-secondary" href="{{ url_for('bancos.caja_chica_conciliacion_lista') }}">{{ _('Cancelar') }}</a></div>
  </form>
</div>
{% endblock %}
