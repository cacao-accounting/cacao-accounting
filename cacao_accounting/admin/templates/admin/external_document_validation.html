{% extends "base.html" %}
{% block contenido %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb lh-sm">
    <li class="breadcrumb-item"><a href="{{ url_for('admin.admin_') }}" class="link-dark">{{ _("Configuración") }}</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ _("External Document Validation") }}</li>
  </ol>
</nav>

<div class="ca-page-header">
  <h4><i class="bi bi-qr-code me-2" style="color:#BB6A40"></i>{{ _("External Document Validation") }}</h4>
</div>

<form method="post" class="ca-card p-3">
  <div class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" role="switch" id="enabled" name="enabled" {% if enabled %}checked{% endif %}>
    <label class="form-check-label" for="enabled">{{ _("Enabled") }}</label>
  </div>

  <div class="mb-3">
    <label for="base_url" class="form-label">{{ _("Base URL") }}</label>
    <input type="url" class="form-control" id="base_url" name="base_url" value="{{ base_url }}" placeholder="{{ fallback_url }}">
    <div class="form-text">{{ _("Fallback: %(fallback)s", fallback=fallback_url) }}</div>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary btn-sm">{{ _("Guardar") }}</button>
    <a href="{{ url_for('admin.admin_') }}" class="btn btn-outline-secondary btn-sm">{{ _("Cancelar") }}</a>
  </div>
</form>
{% endblock %}
