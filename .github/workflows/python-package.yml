name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
          { sed '/^odfpy==/d' requirements.txt; sed '/^-r requirements.txt/d' development.txt; } > /tmp/development-binary.txt
          python -m pip install --only-binary=:all: -r /tmp/development-binary.txt
          python -m pip install --no-binary=:all: odfpy==1.4.1
          python -m pip install --only-binary=:all: -e .
      - name: Lint project code
        run: |
          python -m flake8 cacao_accounting/
          python -m ruff check cacao_accounting/
          python -m pydocstyle cacao_accounting/
          python -m mypy cacao_accounting/

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cacao_accounting/static/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0 flake8==7.3.0 bandit==1.9.4
          { sed '/^odfpy==/d' requirements.txt; sed '/^-r requirements.txt/d' development.txt; } > /tmp/development-binary.txt
          python -m pip install --only-binary=:all: -r /tmp/development-binary.txt
          python -m pip install --no-binary=:all: odfpy==1.4.1
          python -m pip install --only-binary=:all: -e .[cloud]
      - name: Install JavaScript dependencies
        working-directory: cacao_accounting/static
        run: npm ci --ignore-scripts
      - name: Proyecto distribuible
        run: |
          python -m build
          twine check dist/*
      - name: Test with pytest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CACAO_TEST=True LOGURU_LEVEL=WARNING SECRET_KEY=ASD123kljaAddS python -m pytest --full -qq -s --exitfirst --slow=True --tb=line --ignore=tests/test_04database_schema.py --ignore=tests/test_e2e_playwright_accounting.py --ignore=tests/test_e2e_playwright_document_flow.py --ignore=tests/test_e2e_transactional_ui.py
      - name: Test Smart Select JavaScript
        working-directory: cacao_accounting/static
        run: npm test
      - name: Audit JavaScript dependencies
        working-directory: cacao_accounting/static
        run: npm audit --audit-level=low

  databases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install python package
        env:
          CACAO_PRINT_DATABASE_URI: "True"
          CACAO_TEST: "True"
        run: |
          python -m pip install --upgrade pip==26.1.2
          { sed '/^odfpy==/d' requirements.txt; sed '/^-r requirements.txt/d' development.txt; } > /tmp/development-binary.txt
          python -m pip install --only-binary=:all: -r /tmp/development-binary.txt
          python -m pip install --no-binary=:all: odfpy==1.4.1
          python -m pip install --only-binary=:all: -e .[cloud]
          python -m pip install psycopg2-binary==2.9.12
      - name: Test with SQLite
        env:
          CACAO_PRINT_DATABASE_URI: "True"
          CACAO_TEST: "True"
          CACAO_USER: "cacao"
          CACAO_PSWD: "cacao"
          DATABASE_URL: "sqlite:////tmp/cacao-schema.sqlite"
        run: |
          cacaoctl db reset --force
          SECRET_KEY=ASD123kljaAddS python -m pytest tests/test_04database_schema.py --tb=line --quiet
      - name: Test with MySQL + pymysql
        env:
          CACAO_PRINT_DATABASE_URI: "True"
          CACAO_TEST: "True"
          CACAO_USER: "cacao"
          CACAO_PSWD: "cacao"
          DATABASE_URL: "mysql+pymysql://cacao:cacao@localhost/cacao"
        run: |
          sudo systemctl start mysql.service
          mysql --user=root --password=root < tests/setup_mysql.sql
          cacaoctl db reset --force
          SECRET_KEY=ASD123kljaAddS python -m pytest tests/test_04database_schema.py --tb=line --quiet
      - name: Test with Postgresql + psycopg2
        env:
          CACAO_PRINT_DATABASE_URI: "True"
          CACAO_TEST: "True"
          CACAO_USER: "cacao2"
          CACAO_PSWD: "cacao2"
          DATABASE_URL: "postgresql+psycopg2://cacao2:cacao2@localhost/cacao2"
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER cacao2 WITH PASSWORD 'cacao2';"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON SCHEMA public TO cacao2;"
          sudo -u postgres psql -c "CREATE DATABASE cacao2;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE cacao2 TO cacao2;"
          sudo -u postgres psql -c "ALTER DATABASE cacao2 OWNER TO cacao2;"
          sudo -u postgres psql -c "ALTER ROLE cacao2 CREATEDB;"
          sudo -u postgres psql -c "GRANT USAGE ON SCHEMA public TO cacao2;"
          sudo -u postgres psql -c "GRANT CREATE ON SCHEMA public TO cacao2;"
          SECRET_KEY=ASD123klja+AddS cacaoctl db reset --force
          SECRET_KEY=ASD123klja+AddS python -m pytest tests/test_04database_schema.py --tb=line --quiet
      - name: Test with Postgresql + pg8000
        env:
          CACAO_PRINT_DATABASE_URI: "True"
          CACAO_TEST: "True"
          CACAO_USER: "cacao"
          CACAO_PSWD: "cacao"
          DATABASE_URL: "postgresql+pg8000://cacao:cacao@localhost/cacao"
        run: |
          sudo -u postgres psql -c "CREATE USER cacao WITH PASSWORD 'cacao';"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON SCHEMA public TO cacao;"
          sudo -u postgres psql -c "CREATE DATABASE cacao;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE cacao TO cacao;"
          sudo -u postgres psql -c "ALTER DATABASE cacao OWNER TO cacao;"
          sudo -u postgres psql -c "ALTER ROLE cacao CREATEDB;"
          sudo -u postgres psql -c "GRANT USAGE ON SCHEMA public TO cacao;"
          sudo -u postgres psql -c "GRANT CREATE ON SCHEMA public TO cacao;"
          SECRET_KEY=ASD123klj+aAddS LOGURU_LEVEL=WARNING cacaoctl db reset --force
          SECRET_KEY=ASD123klj+aAddS LOGURU_LEVEL=WARNING python -m pytest tests/test_04database_schema.py --tb=line --quiet

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
          { sed '/^odfpy==/d' requirements.txt; sed '/^-r requirements.txt/d' development.txt; } > /tmp/development-binary.txt
          python -m pip install --only-binary=:all: -r /tmp/development-binary.txt
          python -m pip install --no-binary=:all: odfpy==1.4.1
          python -m pip install --only-binary=:all: -e .[cloud]
          python -m playwright install --with-deps chromium
      - name: Run Playwright end-to-end tests
        env:
          CACAO_TEST: "True"
          LOGURU_LEVEL: "WARNING"
          SECRET_KEY: "ASD123kljaAddS"
          PLAYWRIGHT_ARTIFACT_DIR: test-results
        run: |
          python -m pytest tests/test_e2e_playwright_accounting.py tests/test_e2e_playwright_document_flow.py --tb=line --quiet
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cacao_accounting/static/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
          sed '/^odfpy==/d' requirements.txt > /tmp/requirements-binary.txt
          python -m pip install --only-binary=:all: -r /tmp/requirements-binary.txt
          python -m pip install --no-binary=:all: odfpy==1.4.1
          python -m pip install --only-binary=:all: pytest==8.4.1
          python -m pip install --only-binary=:all: -e . --no-deps
      - name: Install JavaScript dependencies
        working-directory: cacao_accounting/static
        run: npm ci --ignore-scripts
      - name: Test with pytest in Desktop Mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACAO_TEST: "True"
          LOGURU_LEVEL: "ERROR"
          SECRET_KEY: "ASD123kljaAddS"
          CACAO_ACCOUNTING_DESKTOP: "True"
        run: |
          python -m pytest --full -qq -s --exitfirst --slow=True --tb=line --ignore=tests/test_04database_schema.py --ignore=tests/test_e2e_playwright_accounting.py --ignore=tests/test_e2e_playwright_document_flow.py --ignore=tests/test_e2e_transactional_ui.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          { sed '/^odfpy==/d' requirements.txt; sed '/^-r requirements.txt/d' development.txt; } > /tmp/development-binary.txt
          python -m pip install --only-binary=:all: -r /tmp/development-binary.txt
          python -m pip install --no-binary=:all: odfpy==1.4.1
          python -m pip install --only-binary=:all: -e .[cloud]
      - name: Test with pytest
        run: |
          SECRET_KEY=ASD123kljaAddS LOGURU_LEVEL=ERROR CACAO_TEST=True python -m pytest --full -qq -s --slow=True --cov=cacao_accounting --ignore=tests/test_04database_schema.py --ignore=tests/test_e2e_playwright_accounting.py --ignore=tests/test_e2e_playwright_document_flow.py --ignore=tests/test_e2e_transactional_ui.py
      - name: Coveralls
        uses: coverallsapp/github-action@v2
