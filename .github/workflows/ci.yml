name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  databases:
    uses: ./.github/workflows/databases.yml
  python:
    uses: ./.github/workflows/python.yml
