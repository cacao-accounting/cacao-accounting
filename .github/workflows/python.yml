name: python

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            mode: deps
          - python-version: "3.13"
            mode: full
          - python-version: "3.13"
            mode: desktop
          - python-version: "3.14"
            mode: deps
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases || false }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
          { sed '/^odfpy==/d' requirements.txt; sed '/^-r requirements.txt/d' development.txt; } > /tmp/development-binary.txt
          python -m pip install --only-binary=:all: -r /tmp/development-binary.txt
          python -m pip install --no-binary=:all: odfpy==1.4.1
          python -m pip install --only-binary=:all: -e .[cloud]
      - name: Import check
        if: matrix.mode == 'deps'
        run: python -c "from cacao_accounting import create_app; print('import ok')"
      - name: Compile translation catalogs
        if: matrix.mode != 'deps'
        run: pybabel compile -d cacao_accounting/translations -D messages -f
      - name: Test with pytest
        if: matrix.mode == 'full'
        env:
          CACAO_TEST: "True"
          LOGURU_LEVEL: "WARNING"
          SECRET_KEY: "ASD123kljaAddS"
        run: |
          python -m pytest --full -qq --tb=line --cov=cacao_accounting
      - name: Test with pytest in Desktop Mode
        if: matrix.mode == 'desktop'
        env:
          CACAO_TEST: "True"
          LOGURU_LEVEL: "ERROR"
          SECRET_KEY: "ASD123kljaAddS"
          CACAO_ACCOUNTING_DESKTOP: "True"
        run: |
          python -m pytest --full -qq --tb=line
      - name: Coveralls
        if: matrix.mode == 'full'
        continue-on-error: true
        uses: coverallsapp/github-action@v2
