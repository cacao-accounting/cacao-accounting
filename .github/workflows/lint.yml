name: lint

on:
  workflow_call:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
          { sed '/^odfpy==/d' requirements.txt; sed '/^-r requirements.txt/d' development.txt; } > /tmp/development-binary.txt
          python -m pip install --only-binary=:all: -r /tmp/development-binary.txt
          python -m pip install --no-binary=:all: odfpy==1.4.1
          python -m pip install --only-binary=:all: -e .
      - name: Lint project code
        run: |
          python -m flake8 cacao_accounting/
          python -m ruff check cacao_accounting/
          python -m pydocstyle cacao_accounting/
          python -m mypy cacao_accounting/
          python -m black --check cacao_accounting/
          python -m complexipy cacao_accounting --max-complexity-allowed 20
          python -m bandit -r cacao_accounting/ -ll -q

  javascript-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cacao_accounting/static/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: cacao_accounting/static
        run: npm ci --ignore-scripts
      - name: Test Smart Select JavaScript
        working-directory: cacao_accounting/static
        run: npm test
