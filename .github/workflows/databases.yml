name: databases

on:
  workflow_call:

jobs:
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install python package
        env:
          CACAO_PRINT_DATABASE_URI: "True"
          CACAO_TEST: "True"
        run: |
          python -m pip install --upgrade pip==26.1.2
          { sed '/^odfpy==/d' requirements.txt; sed '/^-r requirements.txt/d' development.txt; } > /tmp/development-binary.txt
          python -m pip install --only-binary=:all: -r /tmp/development-binary.txt
          python -m pip install --no-binary=:all: odfpy==1.4.1
          python -m pip install --only-binary=:all: -e .[cloud]
          python -m pip install psycopg2-binary==2.9.12
      - name: Test with SQLite
        env:
          CACAO_PRINT_DATABASE_URI: "True"
          CACAO_TEST: "True"
          CACAO_USER: "cacao"
          CACAO_PSWD: "cacao"
          CHECK_DATABASE: "true"
          DATABASE_URL: "sqlite:////tmp/cacao-schema.sqlite"
        run: |
          cacaoctl db reset --force
          SECRET_KEY=ASD123kljaAddS python -m pytest -m database --full --slow=True --tb=line --quiet
      - name: Test with MySQL + pymysql
        env:
          CACAO_PRINT_DATABASE_URI: "True"
          CACAO_TEST: "True"
          CACAO_USER: "cacao"
          CACAO_PSWD: "cacao"
          CHECK_DATABASE: "true"
          DATABASE_URL: "mysql+pymysql://cacao:cacao@localhost/cacao"
        run: |
          sudo systemctl start mysql.service
          mysql --user=root --password=root < tests/setup_mysql.sql
          cacaoctl db reset --force
          SECRET_KEY=ASD123kljaAddS python -m pytest -m database --full --slow=True --tb=line --quiet
      - name: Test with Postgresql + psycopg2
        env:
          CACAO_PRINT_DATABASE_URI: "True"
          CACAO_TEST: "True"
          CACAO_USER: "cacao2"
          CACAO_PSWD: "cacao2"
          CHECK_DATABASE: "true"
          DATABASE_URL: "postgresql+psycopg2://cacao2:cacao2@localhost/cacao2"
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER cacao2 WITH PASSWORD 'cacao2';"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON SCHEMA public TO cacao2;"
          sudo -u postgres psql -c "CREATE DATABASE cacao2;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE cacao2 TO cacao2;"
          sudo -u postgres psql -c "ALTER DATABASE cacao2 OWNER TO cacao2;"
          sudo -u postgres psql -c "ALTER ROLE cacao2 CREATEDB;"
          sudo -u postgres psql -c "GRANT USAGE ON SCHEMA public TO cacao2;"
          sudo -u postgres psql -c "GRANT CREATE ON SCHEMA public TO cacao2;"
          SECRET_KEY=ASD123klja+AddS cacaoctl db reset --force
          SECRET_KEY=ASD123klja+AddS python -m pytest -m database --full --slow=True --tb=line --quiet
      - name: Test with Postgresql + pg8000
        env:
          CACAO_PRINT_DATABASE_URI: "True"
          CACAO_TEST: "True"
          CACAO_USER: "cacao"
          CACAO_PSWD: "cacao"
          CHECK_DATABASE: "true"
          DATABASE_URL: "postgresql+pg8000://cacao:cacao@localhost/cacao"
        run: |
          sudo -u postgres psql -c "CREATE USER cacao WITH PASSWORD 'cacao';"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON SCHEMA public TO cacao;"
          sudo -u postgres psql -c "CREATE DATABASE cacao;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE cacao TO cacao;"
          sudo -u postgres psql -c "ALTER DATABASE cacao OWNER TO cacao;"
          sudo -u postgres psql -c "ALTER ROLE cacao CREATEDB;"
          sudo -u postgres psql -c "GRANT USAGE ON SCHEMA public TO cacao;"
          sudo -u postgres psql -c "GRANT CREATE ON SCHEMA public TO cacao;"
          SECRET_KEY=ASD123klj+aAddS LOGURU_LEVEL=WARNING cacaoctl db reset --force
          SECRET_KEY=ASD123klj+aAddS LOGURU_LEVEL=WARNING python -m pytest -m database --full --slow=True --tb=line --quiet

  cache-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cacao
          POSTGRES_PASSWORD: cacao
          POSTGRES_DB: cacao_cache_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cacao -d cacao_cache_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
          { sed '/^odfpy==/d' requirements.txt; sed '/^-r requirements.txt/d' development.txt; } > /tmp/development-binary.txt
          python -m pip install --only-binary=:all: -r /tmp/development-binary.txt
          python -m pip install --no-binary=:all: odfpy==1.4.1
          python -m pip install --only-binary=:all: -e .[cloud]
          python -m pip install psycopg2-binary==2.9.12
      - name: Test user scoped cache isolation
        env:
          CACAO_TEST: "True"
          DATABASE_URL: postgresql+psycopg2://cacao:cacao@localhost:5432/cacao_cache_tests
          CACHE_REDIS_URL: redis://localhost:6379/2
          RATELIMIT_STORAGE_URI: redis://localhost:6379/0
          SECRET_KEY: cache-isolation-tests
          LOGURU_LEVEL: WARNING
        run: python -m pytest -m cache --tb=line --quiet
